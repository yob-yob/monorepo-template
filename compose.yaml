# City OS demo on vps02, as a Docker Compose stack.
#
# Deployed by .github/workflows/deploy.yml: on a push to main the action SSHes to vps02,
# where /usr/local/bin/deploy-project checks out the commit in /root/projects/city-os and
# runs `docker compose up --detach --build --wait`.
# The .env next to this file is written by Ansible from the infrastructure repo's vault
# (playbooks/vps02-projects.yml) and is never committed.
#
# Published only on vps02's NetBird address (BIND_ADDR); Caddy on vps03 serves the public
# names and proxies over the mesh:
#   city-os.demo.yob-yob.com         -> frontend
#   api.city-os.demo.yob-yob.com     -> backend
#   rustfs-city-os.demo.yob-yob.com  -> rustfs S3 API (browsers use presigned URLs),
#                                       console under /rustfs (mesh only)
name: city-os

services:
  frontend:
    build:
      context: .
      target: frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL}
    image: city-os-frontend:latest
    environment:
      ORIGIN: ${ORIGIN}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/'); process.exit(r.status < 500 ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: .
      target: backend
    image: city-os-backend:latest
    env_file: .env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8081}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/openapi'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # One-shot: applies pending drizzle migrations, then exits; the backend waits for it.
  migrate:
    build:
      context: .
      target: migrate
    image: city-os-migrate:latest
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  # Better Auth's secondary storage (sessions cache); nothing here needs a backup.
  redis:
    image: redis:8.8.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.4
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${ORIGIN}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: ${ORIGIN}
    volumes:
      - rustfs-data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${S3_PORT:-9000}:9000"
      - "${BIND_ADDR:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
