name: Deploy

# On a push to main (or by hand from the Actions tab): SSH to the city-os LXC on homelab01,
# jumping through vps03 (the LXC has no public address). Set up by the infrastructure repo,
# playbooks/homelab-apps.yml; the one key can only open a tunnel to the LXC on vps03, and
# only run `deploy-project city-os` on the LXC:
#   secret   DEPLOY_SSH_KEY      private key
#   variable DEPLOY_HOST         the LXC's LAN address
#   variable DEPLOY_JUMP         deploy-jump@vps03.yob-yob.com
#   variable DEPLOY_KNOWN_HOSTS  host keys of vps03 and the LXC, so both hops are verified
# The LXC builds the images, runs pending migrations, then swaps the containers.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to the city-os LXC
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          JUMP: ${{ vars.DEPLOY_JUMP }}
          COMMIT: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ProxyCommand="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -W %h:%p $JUMP" \
            "root@$HOST" "deploy $COMMIT"
